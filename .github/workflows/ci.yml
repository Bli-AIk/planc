name: Checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check Markdown
        run: |
          if [[ "$GITHUB_HEAD_REF" == release-please--* ]]; then
            npx prettier --write CHANGELOG.md
          fi
          npm run check:md
      - run: npm run check
      - run: git diff --exit-code -- dist skill
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-results
          path: test-results/
